{% extends "base.html" %}
{% block title %}Config - Necroparlor{% endblock %}
{% block content %}

<h1>Configuration</h1>
<div class="subtitle">Per-mode setpoints - changes apply within one control cycle</div>

<div class="grid" id="setpointPanels"></div>

{% endblock %}
{% block scripts %}
<script>
async function loadConfig() {
  const res = await fetch('/api/status');
  const data = await res.json();
  renderSetpointPanels(data.config);
}

function renderSetpointPanels(config) {
  const container = document.getElementById('setpointPanels');
  const modeLabels = {dormant: 'Dormant', ready: 'Ready', cleaning: 'Cleaning'};
  container.innerHTML = '';

  // Explicit left-to-right order, not however the object's keys happen
  // to be ordered (JSON serialization doesn't reliably preserve
  // insertion order across the round trip, so relying on it silently
  // produces whatever order the JSON came back in - alphabetical
  // ordering has shown up in practice, which isn't the intended layout).
  const MODE_ORDER = ['dormant', 'ready', 'cleaning'];
  MODE_ORDER.filter(mode => config.modes[mode]).forEach(mode => {
    const sp = config.modes[mode];
    const panel = document.createElement('div');
    panel.className = 'card';
    let extraFields = '';
    if (mode === 'cleaning') {
      extraFields = `
        <div class="field">
          <label>Ventilation interval (minutes)</label>
          <input type="number" id="${mode}-vent_interval_minutes" value="${sp.vent_interval_minutes}">
        </div>
        <div class="field">
          <label>Ventilation duration (minutes)</label>
          <input type="number" id="${mode}-vent_duration_minutes" value="${sp.vent_duration_minutes}">
        </div>`;
    }
    panel.innerHTML = `
      <h2>${modeLabels[mode]}</h2>
      <div class="field">
        <label>Low temp °F (heater on below)</label>
        <input type="number" step="0.5" id="${mode}-low_temp_f" value="${sp.low_temp_f}">
      </div>
      <div class="field">
        <label>High temp °F (cooling on above)</label>
        <input type="number" step="0.5" id="${mode}-high_temp_f" value="${sp.high_temp_f}">
      </div>
      <div class="field">
        <label>Humidity setpoint %RH</label>
        <input type="number" step="1" id="${mode}-humidity_setpoint" value="${sp.humidity_setpoint}">
      </div>
      <div class="field">
        <label>Out-of-range alert margin, °F (how far past low/high temp before it's worth a push)</label>
        <input type="number" step="0.5" min="0.5" id="${mode}-temp_alert_margin_f" value="${sp.temp_alert_margin_f ?? 5.0}">
      </div>
      <div class="field">
        <label>Out-of-range alert margin, %RH (how far past the humidity setpoint before it's worth a push)</label>
        <input type="number" step="1" min="1" id="${mode}-humidity_alert_margin" value="${sp.humidity_alert_margin ?? 15.0}">
      </div>
      ${extraFields}
      <div class="field">
        <label>Timelapse snapshot interval, minutes (0 = never)</label>
        <input type="number" min="0" id="${mode}-snapshot_interval_minutes" value="${sp.snapshot_interval_minutes ?? 0}">
      </div>
      <button class="save-btn" onclick="saveSetpoints('${mode}')">Save</button>
      <div class="save-msg" id="${mode}-msg"></div>
    `;
    container.appendChild(panel);
  });
}

async function saveSetpoints(mode) {
  const body = {
    mode: mode,
    low_temp_f: parseFloat(document.getElementById(`${mode}-low_temp_f`).value),
    high_temp_f: parseFloat(document.getElementById(`${mode}-high_temp_f`).value),
    humidity_setpoint: parseFloat(document.getElementById(`${mode}-humidity_setpoint`).value),
    temp_alert_margin_f: parseFloat(document.getElementById(`${mode}-temp_alert_margin_f`).value),
    humidity_alert_margin: parseFloat(document.getElementById(`${mode}-humidity_alert_margin`).value),
  };
  if (mode === 'cleaning') {
    body.vent_interval_minutes = parseInt(document.getElementById(`${mode}-vent_interval_minutes`).value, 10);
    body.vent_duration_minutes = parseInt(document.getElementById(`${mode}-vent_duration_minutes`).value, 10);
  }
  body.snapshot_interval_minutes = parseInt(document.getElementById(`${mode}-snapshot_interval_minutes`).value, 10);
  const res = await fetch('/api/setpoints', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
  });
  const data = await res.json();
  const msg = document.getElementById(`${mode}-msg`);
  if (!res.ok) {
    msg.textContent = data.error || 'Save failed';
    msg.className = 'save-msg err';
  } else {
    msg.textContent = 'Saved';
    msg.className = 'save-msg ok';
    setTimeout(() => { msg.textContent = ''; }, 2500);
  }
}

loadConfig();
</script>
{% endblock %}
