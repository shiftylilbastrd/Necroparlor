{% extends "base.html" %}
{% block title %}Logs - Dermestid Enclosure{% endblock %}
{% block head_extra %}
<style>
  @media (max-width: 640px) {
    .event-row { flex-wrap: wrap; row-gap: 2px; column-gap: 8px; padding: 10px 0; }
    .event-row time { width: auto; font-size: 0.78rem; }
    .event-row div:last-child { flex-basis: 100%; }
  }
</style>
{% endblock %}
{% block content %}

<h1>Logs</h1>
<div class="subtitle">Mode changes, relay activity, warnings, and alarms</div>

<div class="filter-row">
  <select id="levelFilter" onchange="resetAndLoad()">
    <option value="">All levels</option>
    <option value="info">Info</option>
    <option value="warning">Warning</option>
    <option value="error">Error</option>
    <option value="critical">Critical</option>
  </select>
  <button onclick="resetAndLoad()">Refresh</button>
</div>

<div class="card events" id="eventsList"></div>
<div style="text-align:center; margin-top:14px;">
  <button id="loadMoreBtn" onclick="loadMore()">Load more</button>
</div>

{% endblock %}
{% block scripts %}
<script>
const PAGE_SIZE = 50;
let oldestLoadedTs = null;
let autoRefreshTimer = null;

function fmtDateTime(ts) {
  return new Date(ts * 1000).toLocaleString([], {
    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
}

function renderEvents(events, append) {
  const container = document.getElementById('eventsList');
  const html = events.map(e => `
    <div class="event-row level-${e.level}">
      <time>${fmtDateTime(e.ts)}</time>
      <div class="level-tag">${e.level}</div>
      <div>${e.message}</div>
    </div>
  `).join('');
  if (append) {
    container.insertAdjacentHTML('beforeend', html);
  } else {
    container.innerHTML = html || '<div class="stat-sub">No events yet</div>';
  }
  if (events.length > 0) {
    oldestLoadedTs = events[events.length - 1].ts;
  }
  document.getElementById('loadMoreBtn').style.display = events.length < PAGE_SIZE ? 'none' : 'inline-block';
}

async function fetchEvents(beforeTs) {
  const level = document.getElementById('levelFilter').value;
  let url = `/api/events?limit=${PAGE_SIZE}`;
  if (level) url += `&level=${level}`;
  if (beforeTs) url += `&before=${beforeTs}`;
  const res = await fetch(url);
  return res.json();
}

async function resetAndLoad() {
  oldestLoadedTs = null;
  const events = await fetchEvents(null);
  renderEvents(events, false);
}

async function loadMore() {
  const events = await fetchEvents(oldestLoadedTs);
  renderEvents(events, true);
}

resetAndLoad();
// Only auto-refresh the newest page - if the user has paged further back,
// refreshing out from under them would be disorienting, so pause it then.
autoRefreshTimer = setInterval(() => {
  if (oldestLoadedTs === null || document.querySelectorAll('.event-row').length <= PAGE_SIZE) {
    resetAndLoad();
  }
}, 15000);
</script>
{% endblock %}
